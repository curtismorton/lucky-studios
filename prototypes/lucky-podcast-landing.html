<!DOCTYPE html>
<html lang="en" class="bg-black">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lucky Studios — Build a Show People Actually Come Back To</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Barlow:wght@300;400;500;600&display=swap" rel="stylesheet" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            heading: ["'Instrument Serif'", "serif"],
            body: ["Barlow", "sans-serif"],
          },
          borderRadius: { DEFAULT: "9999px" },
        },
      },
    };
  </script>

  <style>
    .liquid-glass {
      background: rgba(255,255,255,0.01);
      background-blend-mode: luminosity;
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      border: none;
      box-shadow: inset 0 1px 1px rgba(255,255,255,0.1);
      position: relative;
      overflow: hidden;
    }
    .liquid-glass::before {
      content: "";
      position: absolute; inset: 0;
      border-radius: inherit;
      padding: 1.4px;
      background: linear-gradient(180deg,
        rgba(255,255,255,0.45) 0%,
        rgba(255,255,255,0.15) 20%,
        rgba(255,255,255,0) 40%,
        rgba(255,255,255,0) 60%,
        rgba(255,255,255,0.15) 80%,
        rgba(255,255,255,0.45) 100%);
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
    }
    .liquid-glass-strong {
      background: rgba(255,255,255,0.01);
      background-blend-mode: luminosity;
      backdrop-filter: blur(50px);
      -webkit-backdrop-filter: blur(50px);
      border: none;
      box-shadow: 4px 4px 4px rgba(0,0,0,0.05), inset 0 1px 1px rgba(255,255,255,0.15);
      position: relative;
      overflow: hidden;
    }
    .liquid-glass-strong::before {
      content: "";
      position: absolute; inset: 0;
      border-radius: inherit;
      padding: 1.4px;
      background: linear-gradient(180deg,
        rgba(255,255,255,0.5) 0%,
        rgba(255,255,255,0.2) 20%,
        rgba(255,255,255,0) 40%,
        rgba(255,255,255,0) 60%,
        rgba(255,255,255,0.2) 80%,
        rgba(255,255,255,0.5) 100%);
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
    }
  </style>
</head>
<body class="bg-black">
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/framer-motion@11.11.17/dist/framer-motion.js"></script>
  <script>window.Motion = window.FramerMotion;</script>

  <script type="text/babel">
    const { motion } = window.Motion;

    // Placeholder stock footage (Mixkit, free license). Swap for Lucky Studios
    // footage per the footage brief: dark-graded, crushed blacks, 8-15s loops,
    // slow camera moves, warmth from tungsten practicals.
    const VIDEO_HERO_URL = "https://assets.mixkit.co/videos/32467/32467-720.mp4";
    const VIDEO_PRODUCTION_URL = "https://assets.mixkit.co/videos/44047/44047-1080.mp4";

    /* ---------- FadingVideo: rAF-driven crossfade, manual loop ---------- */
    const FADE_MS = 500;
    const FADE_OUT_LEAD = 0.55;

    function FadingVideo({ src, className, style }) {
      const videoRef = React.useRef(null);
      const rafRef = React.useRef(null);
      const fadingOutRef = React.useRef(false);

      React.useEffect(() => {
        const video = videoRef.current;
        if (!video) return;

        const fadeTo = (target, duration = FADE_MS) => {
          if (rafRef.current) cancelAnimationFrame(rafRef.current);
          const start = parseFloat(video.style.opacity || "0");
          const t0 = performance.now();
          const step = (now) => {
            const p = Math.min((now - t0) / duration, 1);
            video.style.opacity = String(start + (target - start) * p);
            if (p < 1) rafRef.current = requestAnimationFrame(step);
          };
          rafRef.current = requestAnimationFrame(step);
        };

        const onLoaded = () => {
          video.style.opacity = "0";
          video.play().catch(() => {});
          fadeTo(1);
        };
        const onTime = () => {
          const remaining = video.duration - video.currentTime;
          if (!fadingOutRef.current && remaining <= FADE_OUT_LEAD && remaining > 0) {
            fadingOutRef.current = true;
            fadeTo(0);
          }
        };
        const onEnded = () => {
          video.style.opacity = "0";
          setTimeout(() => {
            video.currentTime = 0;
            video.play().catch(() => {});
            fadingOutRef.current = false;
            fadeTo(1);
          }, 100);
        };

        video.addEventListener("loadeddata", onLoaded);
        video.addEventListener("timeupdate", onTime);
        video.addEventListener("ended", onEnded);
        return () => {
          if (rafRef.current) cancelAnimationFrame(rafRef.current);
          video.removeEventListener("loadeddata", onLoaded);
          video.removeEventListener("timeupdate", onTime);
          video.removeEventListener("ended", onEnded);
        };
      }, [src]);

      return (
        <video
          ref={videoRef}
          src={src}
          className={className}
          style={{ opacity: 0, ...style }}
          autoPlay
          muted
          playsInline
          preload="auto"
        />
      );
    }
    window.FadingVideo = FadingVideo;

    /* ---------- BlurText: word-by-word blur-in ---------- */
    function BlurText({ text, className }) {
      const ref = React.useRef(null);
      const [inView, setInView] = React.useState(false);

      React.useEffect(() => {
        const obs = new IntersectionObserver(
          ([entry]) => {
            if (entry.isIntersecting) {
              setInView(true);
              obs.disconnect();
            }
          },
          { threshold: 0.1 }
        );
        if (ref.current) obs.observe(ref.current);
        return () => obs.disconnect();
      }, []);

      const words = text.split(" ");
      return (
        <p
          ref={ref}
          className={className}
          style={{ display: "flex", flexWrap: "wrap", justifyContent: "center", rowGap: "0.1em" }}
        >
          {words.map((word, i) => (
            <motion.span
              key={i}
              initial={{ filter: "blur(10px)", opacity: 0, y: 50 }}
              animate={
                inView
                  ? {
                      filter: ["blur(10px)", "blur(5px)", "blur(0px)"],
                      opacity: [0, 0.5, 1],
                      y: [50, -5, 0],
                    }
                  : {}
              }
              transition={{ duration: 0.7, times: [0, 0.5, 1], ease: "easeOut", delay: (i * 100) / 1000 }}
              style={{ display: "inline-block", marginRight: "0.28em" }}
            >
              {word}
            </motion.span>
          ))}
        </p>
      );
    }
    window.BlurText = BlurText;

    /* ---------- Icons ---------- */
    const ArrowUpRight = ({ className }) => (
      <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <path d="M7 17L17 7" />
        <path d="M7 7h10v10" />
      </svg>
    );
    const PlayIcon = ({ className }) => (
      <svg className={className} viewBox="0 0 24 24" fill="currentColor">
        <polygon points="6 4 20 12 6 20 6 4" />
      </svg>
    );
    const MicOutline = () => (
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" className="text-white">
        <rect x="9" y="2" width="6" height="12" rx="3" />
        <path d="M5 10v1a7 7 0 0 0 14 0v-1" />
        <line x1="12" y1="19" x2="12" y2="22" />
      </svg>
    );
    const HeadphonesOutline = () => (
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" className="text-white">
        <path d="M3 18v-6a9 9 0 0 1 18 0v6" />
        <path d="M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3v5zM3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3v5z" />
      </svg>
    );

    /* ---------- Navbar ---------- */
    const NAV_LINKS = ["Our Shows", "For Creators", "For Brands", "The Studio", "About"];

    function Navbar() {
      return (
        <nav className="fixed top-4 left-0 right-0 z-50 flex items-center justify-between px-8 lg:px-16">
          <div className="liquid-glass flex h-12 w-12 items-center justify-center rounded-full">
            <span className="font-heading italic text-2xl text-white">L</span>
          </div>

          <div className="liquid-glass hidden items-center rounded-full px-1.5 py-1.5 md:flex">
            {NAV_LINKS.map((link) => (
              <a key={link} href="#" className="px-3 py-2 font-body text-sm font-medium text-white/90">
                {link}
              </a>
            ))}
            <a
              href="#"
              className="flex items-center gap-1 whitespace-nowrap rounded-full bg-white px-4 py-2 font-body text-sm font-medium text-black"
            >
              Book a Call
              <ArrowUpRight className="h-4 w-4" />
            </a>
          </div>

          <div className="h-12 w-12 invisible" />
        </nav>
      );
    }

    /* ---------- Shared entrance animation ---------- */
    const enter = (delay) => ({
      initial: { filter: "blur(10px)", opacity: 0, y: 20 },
      animate: { filter: "blur(0px)", opacity: 1, y: 0 },
      transition: { duration: 0.8, delay, ease: "easeOut" },
    });

    /* ---------- Hero ---------- */
    const STATS = [
      { icon: <MicOutline />, value: "5M+", label: "Organic Views Across Studio Formats" },
      { icon: <HeadphonesOutline />, value: "1.1M", label: "Unique Reach Across the Network" },
    ];
    const PLATFORMS = ["Spotify", "Apple Podcasts", "YouTube", "Amazon Music", "TikTok"];

    function Hero() {
      return (
        <section className="relative flex min-h-screen flex-col overflow-hidden bg-black">
          <FadingVideo
            src={VIDEO_HERO_URL}
            className="absolute left-1/2 top-1/2 z-0 max-w-none -translate-x-1/2 -translate-y-1/2 object-cover object-center"
            style={{ width: "120%", height: "120%" }}
          />

          <div className="relative z-10 flex min-h-screen flex-col">
            <Navbar />

            <div className="flex flex-1 flex-col items-center justify-center px-4 pt-24 text-center">
              <motion.div {...enter(0.4)} className="liquid-glass flex items-center gap-3 rounded-full p-1">
                <span className="rounded-full bg-white px-3 py-1 font-body text-xs font-semibold text-black">
                  Now Booking
                </span>
                <span className="pr-3 font-body text-sm text-white/90">
                  Studio sessions open for Summer 2026
                </span>
              </motion.div>

              <div className="mt-6">
                <BlurText
                  text="Build a Show People Actually Come Back To"
                  className="max-w-2xl font-heading text-6xl italic leading-[0.8] tracking-[-4px] text-white md:text-7xl lg:text-[5.5rem]"
                />
              </div>

              <motion.p
                {...enter(0.8)}
                className="mt-4 max-w-2xl font-body text-sm font-light leading-tight text-white md:text-base"
              >
                Lucky Studios creates, produces and grows creator-led podcasts for brands and
                talent — strategy, studio production, editing, clips, distribution and growth,
                all under one roof.
              </motion.p>

              <motion.div {...enter(1.1)} className="mt-6 flex items-center gap-6">
                <a
                  href="#"
                  className="liquid-glass-strong flex items-center gap-2 rounded-full px-5 py-2.5 font-body text-sm font-medium text-white"
                >
                  Book a Consultation
                  <ArrowUpRight className="h-5 w-5" />
                </a>
                <a href="#" className="flex items-center gap-2 font-body text-sm font-medium text-white">
                  Watch the Studio Reel
                  <PlayIcon className="h-4 w-4" />
                </a>
              </motion.div>

              <motion.div {...enter(1.3)} className="mt-8 flex items-stretch gap-4">
                {STATS.map((stat) => (
                  <div key={stat.value} className="liquid-glass flex w-[220px] flex-col justify-between rounded-[1.25rem] p-5 text-left">
                    {stat.icon}
                    <div className="mt-8">
                      <p className="font-heading text-4xl italic leading-none tracking-[-1px] text-white">
                        {stat.value}
                      </p>
                      <p className="mt-2 font-body text-xs font-light text-white">{stat.label}</p>
                    </div>
                  </div>
                ))}
              </motion.div>
            </div>

            <motion.div {...enter(1.4)} className="flex flex-col items-center gap-4 pb-8">
              <span className="liquid-glass rounded-full px-3.5 py-1 font-body text-xs font-medium text-white">
                Distributed everywhere your audience already listens
              </span>
              <div className="flex flex-wrap items-center justify-center gap-12 md:gap-16">
                {PLATFORMS.map((name) => (
                  <span key={name} className="font-heading text-2xl italic tracking-tight text-white md:text-3xl">
                    {name}
                  </span>
                ))}
              </div>
            </motion.div>
          </div>
        </section>
      );
    }

    /* ---------- Production section ---------- */
    const CARDS = [
      {
        title: "Studio Sessions",
        icon: "M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3Zm5-3c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2Z",
        tags: ["4K Multi-Cam", "SM7B Audio", "Broadcast Lighting", "Set Design"],
        body: "Three-camera 4K capture with broadcast-grade audio and lighting. Walk in with an idea, walk out with an episode.",
      },
      {
        title: "Edit & Clips",
        icon: "M4 6.47 5.76 10H20v8H4V6.47M22 4h-4l2 4h-3l-2-4h-2l2 4h-3l-2-4H8l2 4H7L5 4H4c-1.1 0-1.99.89-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V4Z",
        tags: ["Full Episode Edit", "Shorts & Clips", "Captions", "Ready to Post"],
        body: "Every session cut into full episodes and platform-native clips — captioned, formatted and ready to post the same week.",
      },
      {
        title: "Distribution & Growth",
        icon: "M7 18h2V6H7v12Zm4 4h2V2h-2v20Zm-8-8h2v-4H3v4Zm12 4h2V6h-2v12Zm4-8v4h2v-4h-2Z",
        tags: ["Every Platform", "Clip Strategy", "Audience Data", "Sponsor Ready"],
        body: "Strategy, publishing and growth across Spotify, YouTube and social. We read the data so your show compounds.",
      },
    ];

    function Production() {
      return (
        <section className="relative min-h-screen overflow-hidden bg-black">
          <FadingVideo
            src={VIDEO_PRODUCTION_URL}
            className="absolute inset-0 z-0 h-full w-full object-cover"
          />

          <div className="relative z-10 flex min-h-screen flex-col px-8 pb-10 pt-24 md:px-16 lg:px-20">
            <div className="mb-auto">
              <p className="mb-6 font-body text-sm text-white/80">{"// The Lucky System"}</p>
              <h2 className="font-heading text-6xl italic leading-[0.9] tracking-[-3px] text-white md:text-7xl lg:text-[6rem]">
                Production
                <br />
                evolved
              </h2>
            </div>

            <div className="mt-16 grid grid-cols-1 gap-6 md:grid-cols-3">
              {CARDS.map((card) => (
                <div key={card.title} className="liquid-glass flex min-h-[360px] flex-col rounded-[1.25rem] p-6">
                  <div className="flex items-start justify-between gap-4">
                    <div className="liquid-glass flex h-11 w-11 shrink-0 items-center justify-center rounded-[0.75rem]">
                      <svg viewBox="0 0 24 24" fill="currentColor" className="h-6 w-6 text-white">
                        <path d={card.icon} />
                      </svg>
                    </div>
                    <div className="flex max-w-[70%] flex-wrap justify-end gap-1.5">
                      {card.tags.map((tag) => (
                        <span
                          key={tag}
                          className="liquid-glass whitespace-nowrap rounded-full px-3 py-1 font-body text-[11px] text-white/90"
                        >
                          {tag}
                        </span>
                      ))}
                    </div>
                  </div>

                  <div className="flex-1" />

                  <div className="mt-6">
                    <h3 className="font-heading text-3xl italic leading-none tracking-[-1px] text-white md:text-4xl">
                      {card.title}
                    </h3>
                    <p className="mt-3 max-w-[32ch] font-body text-sm font-light leading-snug text-white/90">
                      {card.body}
                    </p>
                  </div>
                </div>
              ))}
            </div>
          </div>
        </section>
      );
    }

    /* ---------- App ---------- */
    function App() {
      return (
        <main className="bg-black">
          <Hero />
          <Production />
        </main>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
