project_id = "lucky-studios"

[auth]
enabled = true
site_url = "https://lucky-studios.vercel.app"
additional_redirect_urls = [
  "https://lucky-studios.vercel.app/api/cms/auth/callback",
  "https://luckystudios.com/api/cms/auth/callback",
  "http://localhost:3000/api/cms/auth/callback",
  "http://127.0.0.1:3000/api/cms/auth/callback",
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false
secure_password_change = false
max_frequency = "1s"
otp_length = 6
otp_expiry = 3600
